services:
  - type: web
    name: dhis2-superpower-train
    env: python
    rootDir: train
    buildCommand: pip install -r requirements.txt
    # Sizing notes for the free/Starter instance:
    #   * ONE sync worker + 4 threads, not two workers.  The app holds a
    #     large in-process payload cache plus two parsed Excel workbooks;
    #     a second worker duplicates all of it and is the quickest way to
    #     hit the instance memory ceiling.
    #   * --timeout 300 is a safety net only.  The blueprint pre-warms its
    #     cache on a daemon thread at boot and then serves stale-while-
    #     revalidate, so no user request should ever wait on the ~47 s
    #     CHAK DHIS2 build that (at --timeout 120) used to kill the worker,
    #     return a 502, and surface as "Failed to load milestone data".
    #   * Deliberately NO --preload: the app starts a background thread at
    #     import time, so preloading would fork workers while the build lock
    #     is held and leave a permanently locked mutex in every child.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300 --graceful-timeout 30
    healthCheckPath: /
    envVars:
      - key: DHIS_BASE_URL
        sync: false
      - key: DHIS_USERNAME
        sync: false
      - key: DHIS_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_BACKUP
        sync: false
      - key: GEMINI_API_KEY1
        sync: false
      - key: GEMINI_API_KEY2
        sync: false
      - key: GEMINI_API_KEY3
        sync: false
      - key: GEMINI_API_KEY4
        sync: false
      - key: GEMINI_MODEL
        sync: false
