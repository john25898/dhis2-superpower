services:
  - type: web
    name: dhis2-superpower-train
    env: python
    rootDir: train
    buildCommand: pip install -r requirements.txt
    # --timeout must exceed the coldest /api/milestone/data build: it pulls
    # LAST_12_MONTHS of MOH 731 for all 259 Daraja OUs from CHAK DHIS2 in a
    # single analytics call (~47 s locally, materially slower on a shared
    # Render CPU).  At --timeout 120 gunicorn killed the worker mid-build,
    # Render served a 502, and the tracker page showed
    # "Failed to load milestone data".  --preload loads the app once before
    # forking so the first request only pays for the DHIS2 fetch.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --preload --timeout 300 --graceful-timeout 30
    healthCheckPath: /
    envVars:
      - key: DHIS_BASE_URL
        sync: false
      - key: DHIS_USERNAME
        sync: false
      - key: DHIS_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_BACKUP
        sync: false
      - key: GEMINI_API_KEY1
        sync: false
      - key: GEMINI_API_KEY2
        sync: false
      - key: GEMINI_API_KEY3
        sync: false
      - key: GEMINI_API_KEY4
        sync: false
      - key: GEMINI_MODEL
        sync: false
