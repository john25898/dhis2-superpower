name: Deploy to chakvista.co.ke

# Runs on every push to main, plus a manual "Run workflow" button.
#
# ── Why Tailscale and not a plain IP ────────────────────────────────────────
# The box sits behind carrier-grade NAT (CGNAT).  Measured 2026-10-01: ping to
# its egress address answers, but *every* TCP port - 22, 80, 443 - is closed
# from the public internet, and no port-forward is possible.  chakvista.co.ke
# resolves to Cloudflare, which reaches the box over a `cloudflared` tunnel.
#
# So a GitHub-hosted runner cannot dial the box directly.  The box is already
# joined to a Tailscale tailnet (tailscaled.service, 100.120.117.89), and
# Tailscale punches out through NAT, so this workflow joins the same tailnet
# for the duration of the job and then SSHes to the tailnet address.  Traffic
# is WireGuard-encrypted end to end; nothing is exposed publicly.
#
#   TAILSCALE_AUTHKEY  auth key from the Tailscale admin console
#                      (reusable + ephemeral; no tags needed - see Step 3c)
#   SSH_HOST           the box's TAILNET address (100.120.117.89)
#   SSH_USER           test      (the user that owns the clone)
#   SSH_PRIVATE_KEY    contents of the deploy private key (ed25519)
#   SSH_PORT           optional, defaults to 22
#   SSH_KNOWN_HOSTS    optional; run `ssh-keyscan 100.120.117.89` and paste it
#   REPO_DIR           optional, defaults to /opt/chakvista
#   SERVICE_NAME       optional, defaults to chakvista
#
# Nothing happens until TAILSCALE_AUTHKEY exists, so this file is safe to merge
# as-is: the first step detects the missing secret and skips with a notice
# instead of failing the build.
#
# See deploy/SETUP.md for the one-time setup on the Ubuntu box.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys overlap.  cancel-in-progress is false on purpose:
# killing a deploy halfway through the git reset or the rollout would leave the
# box in a state nobody asked for.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy over Tailscale
    runs-on: ubuntu-latest
    # 5 min to join the tailnet (the action retries), 15 for the deploy itself.
    timeout-minutes: 20

    steps:
      - name: Check that the deploy secrets are configured
        id: guard
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::TAILSCALE_AUTHKEY is not set. Add the deploy secrets listed at the top of .github/workflows/deploy.yml (see deploy/SETUP.md)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The runner becomes an ephemeral node on the tailnet.  It is removed
      # automatically when the job ends, so no stale device accumulates in the
      # admin console.
      #
      # Deliberately NO `ping:`.  The action's ping runs `tailscale ping`, a
      # DISCO ping over the WireGuard tunnel - a different path from the one
      # the deploy actually uses, and one that fails for reasons that do not
      # affect SSH at all (an unapproved node, a key from another tailnet, a
      # DERP-only path).  It also waits the full 2m before giving up and
      # reports nothing useful.  The `Reach the box` step below replaces it
      # with a TCP connect to the SSH port, which is exactly what has to work.
      - name: Join the tailnet
        id: tailscale
        if: steps.guard.outputs.ready == 'true'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          # Deliberately NO `tags:`.  A tag is only mandatory with an OAuth
          # client; with a plain auth key it is optional, and requesting one
          # makes Tailscale reject the login unless `tagOwners` is declared in
          # the ACL.  Leaving it out means a default-ACL tailnet needs no ACL
          # edit at all.  See deploy/SETUP.md Step 3c for the optional
          # tagged/narrowed setup.
          hostname: gh-deploy-${{ github.run_id }}
          log-mode: normal

      # Peer propagation is eventually consistent, so retry rather than
      # connecting once and blaming SSH.  /dev/tcp is a bash builtin - no nc
      # or curl to install, and it exercises the same TCP path as ssh itself.
      - name: Reach the box
        if: steps.guard.outputs.ready == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -uo pipefail

          SSH_HOST="${SSH_HOST:-100.120.117.89}"
          SSH_PORT="${SSH_PORT:-22}"
          TARGET="$SSH_HOST:$SSH_PORT"

          # ── which tailnet did we actually land in? ─────────────────────
          # `tailscale up` succeeds even when the auth key belongs to a
          # different Tailscale account than the one that owns the box.  The
          # runner then sits in a tailnet the box is not a member of, every
          # packet to it is dropped, and the only symptom is a TCP timeout.
          # MagicDNSSuffix is the tailnet's identity and the peer list says
          # whether the box is even visible, so print both before guessing.
          if command -v tailscale >/dev/null 2>&1; then
            tailscale status --json > /tmp/ts.json 2>/dev/null || true
          fi

          if command -v jq >/dev/null 2>&1 && [ -s /tmp/ts.json ]; then
            {
              jq -r '"self    : \(.Self.DNSName) \(.Self.TailscaleIPs)",
                     "tailnet : \(.MagicDNSSuffix // "?")",
                     "peers   : \(.Peer | length)"' /tmp/ts.json
              jq -r '.Peer[]? | "   - \(.DNSName) \(.TailscaleIPs) online=\(.Online)"' /tmp/ts.json | head -20
            } | tee /tmp/ts.txt
          else
            echo "(tailscale status unavailable - CLI or jq missing)" | tee /tmp/ts.txt
          fi
          echo

          for attempt in 1 2 3 4 5 6; do
            if timeout 10 bash -c "exec 3<>/dev/tcp/$SSH_HOST/$SSH_PORT" 2>/dev/null; then
              echo "TCP $TARGET answered on attempt $attempt."
              exit 0
            fi
            echo "attempt $attempt: TCP $TARGET not answering yet"
            sleep 5
          done

          echo "::error title=Box not reachable over the tailnet::TCP $TARGET never answered (6 attempts)."
          echo "::error::The runner joined the tailnet but has no route to the box. Check, in this order:"
          echo "::error::  1. Tailscale admin > Machines - is a 'gh-deploy-<run id>' node listed? If it shows as needing approval, approve it, or re-create the auth key with 'Pre-approved' ticked."
          echo "::error::  2. Does the auth key belong to the tailnet that owns the box (MagicDNS suffix tail944d6a.ts.net)? A key from another tailnet logs in fine and then can reach nothing."
          echo "::error::  3. Is the box actually online? Run 'tailscale status' on it."
          # Also surface the tailnet identity as annotations, so it can be read
          # straight off the run page without opening the raw log.
          while IFS= read -r line; do echo "::error::ts $line"; done < /tmp/ts.txt
          exit 1

      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REPO_DIR: ${{ secrets.REPO_DIR }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: |
          set -euo pipefail

          # The tailnet address is the default; SSH_HOST only exists so the
          # address can be changed without editing this file.
          SSH_HOST="${SSH_HOST:-100.120.117.89}"
          SSH_USER="${SSH_USER:-test}"
          SSH_PORT="${SSH_PORT:-22}"
          REPO_DIR="${REPO_DIR:-/opt/chakvista}"
          SERVICE_NAME="${SERVICE_NAME:-chakvista}"
          SSH_PRIVATE_KEY="${SSH_PRIVATE_KEY:-}"
          SSH_KNOWN_HOSTS="${SSH_KNOWN_HOSTS:-}"

          # Fail with a readable message rather than an "unbound variable"
          # under `set -u`, which is what a missing secret looks like
          # otherwise.  TAILSCALE_AUTHKEY is checked by the guard step above.
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error title=Missing secret::SSH_PRIVATE_KEY is not set. See deploy/SETUP.md."
            exit 1
          fi

          echo "target:  ${SSH_USER}@${SSH_HOST}:${SSH_PORT}"
          echo "repo:    ${REPO_DIR}"

          # ── private key ────────────────────────────────────────────────
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # ── host key ───────────────────────────────────────────────────
          # The box's host key is pinned in SSH_KNOWN_HOSTS.  Over Tailscale
          # this matters less than on the public internet (WireGuard already
          # authenticates the peer), but pinning costs nothing and catches a
          # reinstalled box before it silently changes identity.
          # Falling back to ssh-keyscan is trust-on-first-use: it protects
          # against nothing, so pin it once you have run the box once.
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "Using pinned host key from SSH_KNOWN_HOSTS."
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            echo "::warning title=Host key not pinned::Falling back to ssh-keyscan. Set SSH_KNOWN_HOSTS to pin it."
          fi
          chmod 600 ~/.ssh/known_hosts

          # BatchMode=yes means a missing key or a host-key mismatch fails
          # fast instead of hanging on a prompt nobody can answer.

          SSH_OPTS=(-i ~/.ssh/deploy_key -p "$SSH_PORT"
                    -o IdentitiesOnly=yes -o BatchMode=yes
                    -o ConnectTimeout=10 -o ServerAliveInterval=15
                    -o ServerAliveCountMax=20)

          TARGET="${SSH_USER}@${SSH_HOST}"

          # ── preflight ──────────────────────────────────────────────────
          echo "::group::Preflight"
          ssh "${SSH_OPTS[@]}" "$TARGET" \
            "test -d '$REPO_DIR/.git' && echo 'clone:   ok' || { echo 'clone:   MISSING at $REPO_DIR'; exit 1; }
             git -C '$REPO_DIR' remote -v | head -1
             echo \"current: \$(git -C '$REPO_DIR' rev-parse --short HEAD)\""
          echo "::endgroup::"

          # ── deploy ─────────────────────────────────────────────────────
          # The script lives in the repo, so it is the freshly-pulled copy that
          # runs — the pipeline and the code it ships stay in lock-step.
          echo "::group::Deploy"
          ssh "${SSH_OPTS[@]}" "$TARGET" \
            "REPO_DIR='$REPO_DIR' SERVICE_NAME='$SERVICE_NAME' bash '$REPO_DIR/deploy/deploy.sh'"
          echo "::endgroup::"

          # ── report the SHA that is actually live ───────────────────────
          LIVE_SHA="$(ssh "${SSH_OPTS[@]}" "$TARGET" "git -C '$REPO_DIR' rev-parse --short HEAD")"
          LIVE_SUBJ="$(ssh "${SSH_OPTS[@]}" "$TARGET" "git -C '$REPO_DIR' log -1 --pretty=%s")"

          {
            echo "### Deployed to chakvista.co.ke"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${LIVE_SHA}\` |"
            echo "| Message | ${LIVE_SUBJ} |"
            echo "| Triggered by | ${GITHUB_SHA::7} |"
            echo "| Site | https://chakvista.co.ke |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the public site answers
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -uo pipefail
          # Public end-to-end check.  /api/milestone/data returns 202 while the
          # cold build runs and 200 once warm, so accept either — this step is
          # proving the service is reachable, not that its cache is warm.
          for attempt in 1 2 3 4 5; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              https://chakvista.co.ke/api/milestone/data || echo 000)"
            echo "attempt ${attempt}: HTTP ${CODE}"
            if [ "$CODE" = "200" ] || [ "$CODE" = "202" ]; then
              echo "Public site is serving." 
              exit 0
            fi
            sleep 10
          done
          echo "::warning title=Public check inconclusive::The deploy reported success but https://chakvista.co.ke did not answer 200/202. Check nginx and DNS."
          exit 0
